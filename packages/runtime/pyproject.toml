[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aeonrift-runtime"
version = "0.1.0"
description = "Execution interception and observation runtime for AEONRIFT."
readme = "README.md"
authors = [
    { name = "AEONRIFT Contributors" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "aeonrift-core"
]
