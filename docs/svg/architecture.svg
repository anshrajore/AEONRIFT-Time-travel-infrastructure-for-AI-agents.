<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" style="background:#0a0a0a; font-family:'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BDFF00" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#BDFF00" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Title & Banner -->
  <text x="40" y="45" fill="#BDFF00" font-size="12" font-weight="700" letter-spacing="3" font-family="monospace">AEONRIFT // SYSTEM ARCHITECTURE &amp; DATA FLOW</text>
  <text x="40" y="70" fill="#FFFFFF" font-size="20" font-weight="800" letter-spacing="-0.5">Time-Travel Infrastructure for Autonomous AI Agents</text>
  <line x1="40" y1="85" x2="860" y2="85" stroke="#222222" stroke-width="1.5"/>

  <!-- Layer 1: Agent & Adapters -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="820" height="60" rx="8" fill="#141414" stroke="#333333" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="35" fill="#888888" font-size="11" font-weight="700" letter-spacing="1.5" font-family="monospace">AGENT LAYER</text>
    <rect x="140" y="14" width="150" height="32" rx="4" fill="#0A0A0A" stroke="#BDFF00" stroke-width="1"/>
    <text x="215" y="35" fill="#BDFF00" font-size="12" font-weight="700" text-anchor="middle">LangChain Adapter</text>
    
    <rect x="310" y="14" width="140" height="32" rx="4" fill="#0A0A0A" stroke="#BDFF00" stroke-width="1"/>
    <text x="380" y="35" fill="#BDFF00" font-size="12" font-weight="700" text-anchor="middle">CrewAI Adapter</text>

    <rect x="470" y="14" width="150" height="32" rx="4" fill="#0A0A0A" stroke="#444444" stroke-width="1"/>
    <text x="545" y="35" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">Custom SDK Agent</text>

    <rect x="640" y="14" width="160" height="32" rx="4" fill="#0A0A0A" stroke="#444444" stroke-width="1"/>
    <text x="720" y="35" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">TypeScript NPM Client</text>
  </g>

  <!-- Arrow down 1 -->
  <path d="M 450 170 L 450 195" stroke="#BDFF00" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="450,200 445,192 455,192" fill="#BDFF00"/>

  <!-- Layer 2: Runtime Interception & Policy -->
  <g transform="translate(40, 205)">
    <rect x="0" y="0" width="820" height="85" rx="8" fill="#141414" stroke="#BDFF00" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="48" fill="#BDFF00" font-size="11" font-weight="700" letter-spacing="1.5" font-family="monospace">RUNTIME LAYER</text>
    
    <rect x="140" y="18" width="200" height="50" rx="6" fill="#1E1E1E" stroke="#333333"/>
    <text x="240" y="40" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">AeonriftRuntime</text>
    <text x="240" y="56" fill="#888888" font-size="10" text-anchor="middle">Tool Call Interception &amp; Context</text>

    <rect x="360" y="18" width="210" height="50" rx="6" fill="#1E1E1E" stroke="#BDFF00" stroke-opacity="0.6"/>
    <text x="465" y="40" fill="#BDFF00" font-size="13" font-weight="700" text-anchor="middle">RollbackGuard</text>
    <text x="465" y="56" fill="#888888" font-size="10" text-anchor="middle">Side-Effect Hazard Prevention</text>

    <rect x="590" y="18" width="210" height="50" rx="6" fill="#1E1E1E" stroke="#333333"/>
    <text x="695" y="40" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">RiftPolicyEngine</text>
    <text x="695" y="56" fill="#888888" font-size="10" text-anchor="middle">Semantic Checkpoint Decision</text>
  </g>

  <!-- Arrow down 2 -->
  <path d="M 450 290 L 450 315" stroke="#BDFF00" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="450,320 445,312 455,312" fill="#BDFF00"/>

  <!-- Layer 3: Core Causal Engine & Services -->
  <g transform="translate(40, 325)">
    <rect x="0" y="0" width="820" height="95" rx="8" fill="#141414" stroke="#333333" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="53" fill="#888888" font-size="11" font-weight="700" letter-spacing="1.5" font-family="monospace">CORE SERVICES</text>
    
    <rect x="140" y="18" width="155" height="60" rx="6" fill="#0A0A0A" stroke="#333333"/>
    <text x="217" y="42" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">CausalStateGraph</text>
    <text x="217" y="58" fill="#888888" font-size="10" text-anchor="middle">SHA-256 Event DAG</text>

    <rect x="305" y="18" width="165" height="60" rx="6" fill="#0A0A0A" stroke="#BDFF00" stroke-width="1"/>
    <text x="387" y="42" fill="#BDFF00" font-size="12" font-weight="700" text-anchor="middle">SideEffectLedger</text>
    <text x="387" y="58" fill="#888888" font-size="10" text-anchor="middle">Idempotency Locks</text>

    <rect x="480" y="18" width="160" height="60" rx="6" fill="#0A0A0A" stroke="#333333"/>
    <text x="560" y="42" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">RecoveryPlanner</text>
    <text x="560" y="58" fill="#888888" font-size="10" text-anchor="middle">LLM &amp; Rule Engine</text>

    <rect x="650" y="18" width="150" height="60" rx="6" fill="#0A0A0A" stroke="#333333"/>
    <text x="725" y="42" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">LayeredEngine</text>
    <text x="725" y="58" fill="#888888" font-size="10" text-anchor="middle">L0–L5 Checkpointing</text>
  </g>

  <!-- Arrow down 3 -->
  <path d="M 450 420 L 450 440" stroke="#555555" stroke-width="1.5"/>
  <polygon points="450,445 446,438 454,438" fill="#555555"/>

  <!-- Layer 4: Storage & Security -->
  <g transform="translate(40, 450)">
    <rect x="0" y="0" width="820" height="45" rx="6" fill="#1A1A1A" stroke="#222222"/>
    <text x="20" y="27" fill="#666666" font-size="10" font-weight="700" letter-spacing="1.5" font-family="monospace">STORAGE &amp; SECURITY</text>
    <text x="210" y="27" fill="#AAAAAA" font-size="11" font-family="monospace">DurableEventStore (JSONL Log)</text>
    <text x="450" y="27" fill="#AAAAAA" font-size="11" font-family="monospace">HMAC-SHA256 Secret Scrubbing</text>
    <text x="690" y="27" fill="#BDFF00" font-size="11" font-family="monospace">State Reconciler</text>
  </g>
</svg>
